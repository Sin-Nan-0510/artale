<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 隊伍分配</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- 引入 SortableJS 以實現流暢的拖甩功能 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* 拖拽效果相關樣式 */
        .drag-item {
            cursor: grab;
        }

        .drag-item:active {
            cursor: grabbing;
        }

        .sortable-ghost {
            opacity: 0.3;
            background-color: #3b82f6 !important;
            border: 2px dashed #60a5fa !important;
        }

        .sortable-drag {
            cursor: grabbing !important;
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* =====================================================
           分享圖片產生區
        ====================================================== */

        #share-card {
            position: fixed;
            left: -100000px;
            top: 0;
            width: 580px;
            pointer-events: none;
        }

        .share-card-inner {
            width: 580px;
            padding: 24px 28px;
            background: #111111;
            color: #d1d5db;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        .share-group-header-text {
            font-size: 26px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .share-team-title-text {
            font-size: 21px;
            font-weight: 700;
            color: #93c5fd;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .share-row-item {
            display: flex;
            align-items: center;
            font-size: 22px;
            line-height: 1.55;
            color: #e5e7eb;
            margin-bottom: 4px;
        }

        .share-col-level {
            width: 55px;
            text-align: right;
            margin-right: 18px;
            color: #93c5fd;
            font-weight: 600;
            flex-shrink: 0;
        }

        .share-col-job {
            width: 80px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .share-col-name {
            width: 200px;
            margin-right: 16px;
            flex-shrink: 0;
            word-break: break-all;
        }

        .share-col-position {
            flex: 1;
            text-align: left;
            color: #cbd5e1;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <div class="mx-auto max-w-7xl">

        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="mb-2 text-3xl font-bold tracking-wide text-blue-400 md:text-4xl">
                Artale 隊伍分配
            </h1>
            <p id="summary" class="hidden"></p>
        </header>

        <!-- 團數控制 -->
        <div class="mb-6 rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h2 class="text-base font-bold text-slate-200">
                        遠征團管理
                    </h2>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="removeGroup()" class="rounded-lg border border-slate-700 bg-slate-800 px-3.5 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-700">
                        減少一團
                    </button>
                    <span id="group-count" class="min-w-16 rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 text-center text-sm font-semibold text-slate-300">
                        5 / 5
                    </span>
                    <button onclick="addGroup()" class="rounded-lg bg-blue-600 px-3.5 py-2 text-sm font-medium text-white transition hover:bg-blue-500">
                        新增一團
                    </button>
                </div>
            </div>

            <div id="group-tabs" class="mt-4 flex flex-wrap gap-3"></div>
        </div>

        <!-- 主內容區 -->
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
            <div id="teams-area" class="space-y-6 lg:col-span-2"></div>

            <div class="space-y-6">
                <div class="sticky top-6 rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <h2 class="mb-3 text-base font-bold text-slate-200">
                        快速貼上與匯入
                    </h2>
                    <div class="mb-3 rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 text-center font-mono text-xs font-medium tracking-wide text-slate-400">
                        等級 名字 職業 位置
                    </div>
                    <textarea id="paste-input" rows="7" class="mb-3 w-full resize-none rounded-lg border border-slate-800 bg-slate-950 p-3 font-mono text-sm text-slate-200 focus:border-blue-500 focus:outline-none" placeholder="等級 職業 名字 位置"></textarea>
                    <button onclick="handleBatchImport()" class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-blue-500">
                        加入共用待分配名單
                    </button>
                    <hr class="my-5 border-slate-800">
                    <button onclick="generateAllTeamsImage()" class="w-full rounded-lg border border-blue-900 bg-blue-950/50 px-4 py-3 text-sm font-bold text-blue-300 transition hover:bg-blue-900/50">
                        產生全部團隊圖片
                    </button>
                    <button onclick="clearCurrentGroup()" class="mt-4 w-full rounded-lg border border-slate-800 bg-slate-800 px-4 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-slate-700">
                        清空目前團
                    </button>
                    <button onclick="clearAllData()" class="mt-2.5 w-full rounded-lg border border-slate-800 bg-slate-800 px-4 py-2.5 text-sm font-medium text-rose-400 transition hover:bg-slate-700">
                        清空全部
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 圖片暫存區 -->
    <div id="share-card"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCb4unyxOqVMPA8ZPB7GOp6ugqdXz3p0JM",
            authDomain: "artale-21938.firebaseapp.com",
            databaseURL: "https://artale-21938-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "artale-21938",
            storageBucket: "artale-21938.firebasestorage.app",
            messagingSenderId: "532854932886",
            appId: "1:532854932886:web:3bdd0ab90b230264abc9b7"
        };

        const FIREBASE_PATH = "artale_ryuou_shared_state";
        const STORAGE_KEY = "artale_ryuou_groups_state_v8";
        const MAX_GROUPS = 5;
        const MAX_TEAM_SIZE = 6;

        let database = null;
        let firebaseEnabled = false;
        let isRemoteUpdate = false;
        let sortableInstances = [];

        try {
            if (firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("請填入")) {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseEnabled = true;
            }
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
            firebaseEnabled = false;
        }

        function emptyGroup() {
            return { team1: [], team2: [], time: "", date: "" };
        }

        function createDefaultGroups() {
            return Array.from({ length: MAX_GROUPS }, () => emptyGroup());
        }

        let state = {
            activeGroup: 0,
            pool: [],
            groups: createDefaultGroups()
        };

        function isLevel(value) {
            return /^(?:lv\.?\s*)?\d+$/i.test(String(value || "").trim());
        }

        function normalizeLevel(value) {
            const text = String(value || "").trim();
            const match = text.match(/\d+/);
            return match ? match[0] : "";
        }

        function getPlayerLevel(player) {
            if (!player) return "";
            const possibleFields = [
                player.level, player.lv, player["等級"],
                player.levelText, player.levelDisplay,
                player.levelNumber, player.levelValue, player["等級數字"]
            ];
            for (const value of possibleFields) {
                if (isLevel(value)) {
                    const level = normalizeLevel(value);
                    if (level) return level;
                }
            }
            return "";
        }

        function normalizePlayer(player) {
            if (!player || typeof player !== "object") return null;
            const result = {
                id: player.id || Date.now() + "-" + Math.random().toString(36).substring(2, 10),
                level: getPlayerLevel(player),
                name: String(player.name || player["名稱"] || player["名字"] || "").trim(),
                job: String(player.job || player["職業"] || "未填").trim(),
                position: String(player.position || player["位置"] || "").trim()
            };

            if (!player.position && !player["位置"] && result.job) {
                const match = result.job.match(/^(.*?)\s*\((.*?)\)\s*$/);
                if (match) {
                    result.job = match[1].trim();
                    result.position = match[2].trim();
                }
            }
            return result;
        }

        function normalizeState(data) {
            if (!data || typeof data !== "object") {
                return { activeGroup: 0, pool: [], groups: createDefaultGroups() };
            }
            let groups = Array.isArray(data.groups) ? data.groups.slice(0, MAX_GROUPS) : [];
            if (groups.length === 0) groups = createDefaultGroups();

            const pool = Array.isArray(data.pool) ? data.pool.map(normalizePlayer).filter(Boolean) : [];

            groups = groups.map(group => {
                if (!group || typeof group !== "object") return emptyGroup();
                return {
                    team1: Array.isArray(group.team1) ? group.team1.map(normalizePlayer).filter(Boolean) : [],
                    team2: Array.isArray(group.team2) ? group.team2.map(normalizePlayer).filter(Boolean) : [],
                    time: typeof group.time === "string" ? group.time : "",
                    date: typeof group.date === "string" ? group.date : ""
                };
            });

            let activeGroup = typeof data.activeGroup === "number" ? data.activeGroup : 0;
            if (activeGroup < 0 || activeGroup >= groups.length) activeGroup = 0;

            return { activeGroup, pool, groups };
        }

        function currentGroup() {
            return state.groups[state.activeGroup];
        }

        function saveState(skipRender = false) {
            if (isRemoteUpdate) return;
            if (firebaseEnabled) {
                database.ref(FIREBASE_PATH).set(state).catch(error => {
                    console.error("Firebase 儲存失敗：", error);
                });
            } else {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (error) {
                    console.error("LocalStorage 儲存失敗：", error);
                }
            }
            if (!skipRender) {
                render();
            }
        }

        function loadInitialState() {
            if (!firebaseEnabled) {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
                    state = normalizeState(saved);
                } catch (error) {
                    state = normalizeState(null);
                }
                render();
                return;
            }

            database.ref(FIREBASE_PATH).on("value", snapshot => {
                const data = snapshot.val();
                if (data) {
                    isRemoteUpdate = true;
                    state = normalizeState(data);
                    render();
                    isRemoteUpdate = false;
                } else {
                    database.ref(FIREBASE_PATH).set(state).catch(error => console.error(error));
                    render();
                }
            }, error => console.error(error));
        }

        function addGroup() {
            if (state.groups.length >= MAX_GROUPS) {
                alert("目前已經有 5 團。");
                return;
            }
            state.groups.push(emptyGroup());
            state.activeGroup = state.groups.length - 1;
            saveState();
        }

        function removeGroup() {
            if (state.groups.length <= 1) {
                alert("至少要保留 1 團。");
                return;
            }
            const index = state.activeGroup;
            const group = state.groups[index];
            const total = group.team1.length + group.team2.length;

            if (total > 0 && !confirm(`第 ${index + 1} 團目前有 ${total} 人，確定要刪除這一團嗎？`)) {
                return;
            }

            state.pool.push(...group.team1, ...group.team2);
            state.groups.splice(index, 1);
            if (state.activeGroup >= state.groups.length) {
                state.activeGroup = state.groups.length - 1;
            }
            saveState();
        }

        function selectGroup(index) {
            if (index < 0 || index >= state.groups.length) return;
            state.activeGroup = index;
            saveState();
        }

        function updateGroupTime(index, time) {
            if (!state.groups[index]) return;
            state.groups[index].time = time.trim();
            saveState(true);
        }

        function updateGroupDate(index, date) {
            if (!state.groups[index]) return;
            state.groups[index].date = date.trim();
            saveState(true);
        }

        function getWeekday(date) {
            if (!date) return "";
            const parts = date.split("/");
            const month = Number(parts[0]);
            const day = Number(parts[1]);
            const year = new Date().getFullYear();
            const d = new Date(year, month - 1, day);
            if (d.getMonth() !== month - 1 || d.getDate() !== day) return "";
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
            return weekdays[d.getDay()];
        }

        function updatePlayerField(targetType, index, field, value) {
            let player = null;
            if (targetType === "pool") {
                player = state.pool[index];
            } else if (targetType === "team1" || targetType === "team2") {
                const group = currentGroup();
                if (group) player = group[targetType][index];
            }

            if (!player) return;

            if (field === "level") {
                player.level = normalizeLevel(value);
            } else {
                player[field] = String(value || "");
            }

            saveState(true);
        }

        function handleBatchImport() {
            const input = document.getElementById("paste-input");
            const text = input.value.trim();
            if (!text) {
                alert("請先貼上名單。");
                return;
            }

            let addedCount = 0;
            let skippedCount = 0;

            text.split(/\r?\n/).forEach(line => {
                line = line.trim();
                if (!line) return;
                const parts = line.split(/\s+/);
                const headerText = parts.join("");
                if (headerText.includes("等級") && headerText.includes("職業")) return;

                let level = "", name = "", job = "", position = "";

                if (parts.length === 1) {
                    name = parts[0];
                    job = "未填";
                } else if (parts.length === 2) {
                    name = parts[0];
                    job = parts[1];
                } else if (parts.length === 3) {
                    if (isLevel(parts[0])) {
                        level = normalizeLevel(parts[0]);
                        job = parts[1];
                        name = parts[2];
                    } else {
                        job = parts[0];
                        name = parts[1];
                        position = parts[2];
                    }
                } else {
                    if (isLevel(parts[0])) {
                        level = normalizeLevel(parts[0]);
                        job = parts[1];
                        name = parts[2];
                        position = parts.slice(3).join(" ");
                    } else {
                        job = parts[0];
                        name = parts[1];
                        position = parts.slice(2).join(" ");
                    }
                }

                if (!name) {
                    skippedCount++;
                    return;
                }

                state.pool.push({
                    id: Date.now() + "-" + Math.random().toString(36).substring(2, 10),
                    level, name, job: job || "未填", position
                });
                addedCount++;
            });

            input.value = "";
            saveState();
            alert(`成功加入 ${addedCount} 人到共用待分配名單。`);
        }

        function moveTo(index, fromGroup, toGroup) {
            const group = currentGroup();
            if (!group) return;
            let item;

            if (fromGroup === "pool") item = state.pool.splice(index, 1)[0];
            else if (fromGroup === "team1") item = group.team1.splice(index, 1)[0];
            else if (fromGroup === "team2") item = group.team2.splice(index, 1)[0];

            if (!item) return;

            if (toGroup === "pool") {
                state.pool.push(item);
            } else if (toGroup === "team1") {
                if (group.team1.length < MAX_TEAM_SIZE) group.team1.push(item);
                else { alert("第一隊已滿（6人）"); state.pool.push(item); }
            } else if (toGroup === "team2") {
                if (group.team2.length < MAX_TEAM_SIZE) group.team2.push(item);
                else { alert("第二隊已滿（6人）"); state.pool.push(item); }
            }
            saveState();
        }

        function clearCurrentGroup() {
            const group = currentGroup();
            if (!group) return;
            const total = group.team1.length + group.team2.length;
            if (!confirm(`確定要清空第 ${state.activeGroup + 1} 團嗎？\n\n目前共有 ${total} 人。\n這些玩家會回到「共用待分配名單」。`)) return;

            state.pool.push(...group.team1, ...group.team2);
            state.groups[state.activeGroup] = emptyGroup();
            saveState();
        }

        function clearAllData() {
            if (!confirm("確定要清空全部資料嗎？\n\n清空後會恢復成預設 5 團。")) return;
            state = { activeGroup: 0, pool: [], groups: createDefaultGroups() };
            saveState();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function memberCard(player, index, teamName) {
            const level = getPlayerLevel(player);

            return `
                <div data-id="${player.id}" class="drag-item flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950 p-2.5 transition hover:border-slate-700">
                    <div class="min-w-0 pr-1 flex-1">
                        <div class="flex items-center gap-1 flex-wrap">
                            <span class="text-xs font-semibold text-slate-500 select-none">#${index + 1}</span>
                            
                            <!-- 等級輸入框 -->
                            <div class="flex items-center">
                                <span class="text-xs text-slate-500 select-none">Lv.</span>
                                <input
                                    type="text"
                                    value="${escapeHtml(level)}"
                                    placeholder="-"
                                    maxlength="3"
                                    inputmode="numeric"
                                    oninput="updatePlayerField('${teamName}', ${index}, 'level', this.value)"
                                    class="w-8 rounded border border-slate-800 bg-slate-900 px-1 py-0.5 text-center text-xs font-semibold text-blue-400 focus:border-blue-500 focus:outline-none"
                                    title="點擊修改等級">
                            </div>

                            <!-- 名字輸入框 -->
                            <input
                                type="text"
                                value="${escapeHtml(player.name)}"
                                placeholder="名字"
                                oninput="updatePlayerField('${teamName}', ${index}, 'name', this.value)"
                                class="w-24 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs font-bold text-slate-200 focus:border-blue-500 focus:outline-none"
                                title="點擊修改名字">

                            <!-- 職業輸入框 -->
                            <input
                                type="text"
                                value="${escapeHtml(player.job)}"
                                placeholder="職業"
                                oninput="updatePlayerField('${teamName}', ${index}, 'job', this.value)"
                                class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-400 focus:border-blue-500 focus:outline-none"
                                title="點擊修改職業">

                            <!-- 位置輸入框 -->
                            <input
                                type="text"
                                value="${escapeHtml(player.position)}"
                                placeholder="位置"
                                oninput="updatePlayerField('${teamName}', ${index}, 'position', this.value)"
                                class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-500 focus:border-blue-500 focus:outline-none"
                                title="點擊修改位置">
                        </div>
                    </div>
                    <div class="flex shrink-0 gap-1 ml-1">
                        <button onclick="moveTo(${index}, '${teamName}', 'pool')" title="退回待分配" class="rounded bg-slate-900 border border-slate-800 px-2 py-1 text-xs text-rose-400 hover:bg-rose-950">✕</button>
                    </div>
                </div>
            `;
        }

        function renderTeam(teamName, title, emoji) {
            const group = currentGroup();
            const members = group[teamName];

            let html = `
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                        <h2 class="flex items-center gap-2 text-lg font-bold text-slate-200">
                            <span>${emoji}</span>
                            ${title}
                            <span class="text-xs font-normal text-slate-500">(上限 6 人)</span>
                        </h2>
                        <span class="rounded-full bg-slate-800 px-2.5 py-1 text-xs font-semibold text-slate-300">
                            ${members.length} / 6
                        </span>
                    </div>
                    <div id="${teamName}-list" data-list-type="${teamName}" class="sortable-list grid min-h-[100px] grid-cols-1 gap-3 sm:grid-cols-2">
            `;

            for (let i = 0; i < members.length; i++) {
                html += memberCard(members[i], i, teamName);
            }

            html += `</div></div>`;
            return html;
        }

        function renderPool() {
            let html = `
                <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-sm">
                    <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                        <h2 class="flex items-center gap-2 text-lg font-bold text-slate-200">
                            <span>👥</span>
                            共用待分配名單
                        </h2>
                        <span class="rounded-full bg-blue-950 px-2.5 py-1 text-xs font-semibold text-blue-400">
                            ${state.pool.length} 人
                        </span>
                    </div>
                    <div id="pool-list" data-list-type="pool" class="sortable-list flex min-h-[80px] flex-wrap gap-2">
            `;

            if (state.pool.length === 0) {
                html += `<p class="empty-msg py-2 text-sm text-slate-500">目前沒有待分配成員（可拖甩玩家至此）。</p>`;
            } else {
                state.pool.forEach((player, index) => {
                    const level = getPlayerLevel(player);
                    html += `
                        <div data-id="${player.id}" class="drag-item flex items-center gap-1.5 rounded-lg border border-slate-800 bg-slate-950 px-2.5 py-2 text-sm">
                            <div class="flex items-center gap-1">
                                <span class="text-xs text-slate-500 select-none">Lv.</span>
                                <input
                                    type="text"
                                    value="${escapeHtml(level)}"
                                    placeholder="-"
                                    maxlength="3"
                                    inputmode="numeric"
                                    oninput="updatePlayerField('pool', ${index}, 'level', this.value)"
                                    class="w-8 rounded border border-slate-800 bg-slate-900 px-1 py-0.5 text-center text-xs font-semibold text-blue-400 focus:border-blue-500 focus:outline-none"
                                    title="點擊修改等級">
                                <input
                                    type="text"
                                    value="${escapeHtml(player.name)}"
                                    placeholder="名字"
                                    oninput="updatePlayerField('pool', ${index}, 'name', this.value)"
                                    class="w-20 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs font-bold text-slate-200 focus:border-blue-500 focus:outline-none"
                                    title="點擊修改名字">
                                <input
                                    type="text"
                                    value="${escapeHtml(player.job)}"
                                    placeholder="職業"
                                    oninput="updatePlayerField('pool', ${index}, 'job', this.value)"
                                    class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-400 focus:border-blue-500 focus:outline-none"
                                    title="點擊修改職業">
                                <input
                                    type="text"
                                    value="${escapeHtml(player.position)}"
                                    placeholder="位置"
                                    oninput="updatePlayerField('pool', ${index}, 'position', this.value)"
                                    class="w-16 rounded border border-slate-800 bg-slate-900 px-1.5 py-0.5 text-xs text-slate-500 focus:border-blue-500 focus:outline-none"
                                    title="點擊修改位置">
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            return html;
        }

        /* 初始化 Drag & Drop 拖拉監聽器 */
        function initSortables() {
            sortableInstances.forEach(inst => inst.destroy());
            sortableInstances = [];

            const lists = document.querySelectorAll('.sortable-list');
            lists.forEach(el => {
                const instance = new Sortable(el, {
                    group: {
                        name: 'shared-teams',
                        put: function (to) {
                            const listType = to.el.dataset.listType;
                            if (listType === 'team1' || listType === 'team2') {
                                const group = currentGroup();
                                return group[listType].length < MAX_TEAM_SIZE;
                            }
                            return true;
                        }
                    },
                    animation: 150,
                    filter: 'input, button', // 點擊或聚焦在輸入框與按鈕時不觸發拖甩，避免無法打字
                    preventOnFilter: false, // 允許輸入框正常的 focus / 點擊行為
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function (evt) {
                        const fromType = evt.from.dataset.listType;
                        const toType = evt.to.dataset.listType;
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;

                        if (fromType === toType && oldIndex === newIndex) return;

                        const group = currentGroup();
                        let item;

                        // 移除原位置元素
                        if (fromType === 'pool') {
                            item = state.pool.splice(oldIndex, 1)[0];
                        } else {
                            item = group[fromType].splice(oldIndex, 1)[0];
                        }

                        if (!item) return;

                        // 放進新位置
                        if (toType === 'pool') {
                            state.pool.splice(newIndex, 0, item);
                        } else {
                            group[toType].splice(newIndex, 0, item);
                        }

                        saveState();
                    }
                });
                sortableInstances.push(instance);
            });
        }

        function formatShareLine(player) {
            const level = getPlayerLevel(player);
            const levelStr = level ? level : "---";
            const jobStr = player.job || "未填";
            const nameStr = player.name || "";
            const positionStr = player.position || "";

            return `
                <div class="share-row-item">
                    <div class="share-col-level">${escapeHtml(levelStr)}</div>
                    <div class="share-col-job">${escapeHtml(jobStr)}</div>
                    <div class="share-col-name">${escapeHtml(nameStr)}</div>
                    <div class="share-col-position">${escapeHtml(positionStr)}</div>
                </div>
            `;
        }

        async function generateAllTeamsImage() {
            if (typeof html2canvas === "undefined") {
                alert("圖片工具尚未載入完成，請稍後再試。");
                return;
            }

            const shareCard = document.getElementById("share-card");
            
            const activeGroups = [];
            state.groups.forEach((group, groupIndex) => {
                const hasTeam1 = group.team1 && group.team1.length > 0;
                const hasTeam2 = group.team2 && group.team2.length > 0;
                if (hasTeam1 || hasTeam2) {
                    activeGroups.push({ groupIndex, group });
                }
            });

            if (activeGroups.length === 0) {
                alert("目前所有團隊都沒有成員，沒有可產生的圖片。");
                return;
            }

            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");

            for (let i = 0; i < activeGroups.length; i++) {
                const { groupIndex, group } = activeGroups[i];
                const weekday = getWeekday(group.date);
                const dateText = group.date ? `${group.date}${weekday ? `（${weekday}）` : ""}` : "";
                const timeText = group.time || "";
                
                const headerInfo = [dateText, timeText, `第${groupIndex + 1}團`].filter(Boolean).join(" ");

                let contentHtml = `<div class="share-group-header-text">${escapeHtml(headerInfo)}</div>`;

                if (group.team1 && group.team1.length > 0) {
                    contentHtml += `<div class="share-team-title-text">⚔️ 第一隊 (${group.team1.length}人)</div>`;
                    group.team1.forEach(player => {
                        contentHtml += formatShareLine(player);
                    });
                }

                if (group.team2 && group.team2.length > 0) {
                    contentHtml += `<div class="share-team-title-text">⚔️ 第二隊 (${group.team2.length}人)</div>`;
                    group.team2.forEach(player => {
                        contentHtml += formatShareLine(player);
                    });
                }

                shareCard.innerHTML = `
                    <div class="share-card-inner">
                        ${contentHtml}
                    </div>
                `;

                try {
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    const canvas = await html2canvas(shareCard.firstElementChild, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#111111",
                        logging: false,
                        imageTimeout: 0
                    });

                    const link = document.createElement("a");
                    link.download = `Artale_第${groupIndex + 1}團_${year}-${month}-${day}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();

                    await new Promise(resolve => setTimeout(resolve, 300));
                } catch (error) {
                    console.error("產生團隊圖片失敗：", error);
                }
            }

            shareCard.innerHTML = "";
            alert(`已成功產生並下載 ${activeGroups.length} 張團隊圖片！`);
        }

        function render() {
            state = normalizeState(state);
            const count = state.groups.length;
            document.getElementById("group-count").innerText = `${count} / ${MAX_GROUPS}`;
            document.getElementById("summary").innerText = `目前 ${count} 團・共用待分配 ${state.pool.length} 人`;

            const tabs = document.getElementById("group-tabs");
            tabs.innerHTML = state.groups.map((group, index) => {
                const weekday = getWeekday(group.date);
                return `
                    <div class="flex flex-col items-center gap-1.5 rounded-lg border border-slate-800 bg-slate-950 p-2.5">
                        <button
                            onclick="selectGroup(${index})"
                            class="rounded-md px-3.5 py-1.5 text-xs font-semibold transition ${
                                index === state.activeGroup
                                    ? "bg-blue-600 text-white shadow-sm"
                                    : "bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800"
                            }">
                            第 ${index + 1} 團
                        </button>
                        <input
                            type="text"
                            value="${escapeHtml(group.time || "")}"
                            placeholder="19:30"
                            maxlength="5"
                            inputmode="numeric"
                            oninput="updateGroupTime(${index}, this.value)"
                            class="w-24 rounded border border-slate-800 bg-slate-900 px-2 py-1 text-center text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            title="設定時間">
                        <div class="flex items-center gap-1">
                            <input
                                type="text"
                                value="${escapeHtml(group.date || "")}"
                                placeholder="9/8"
                                maxlength="5"
                                inputmode="numeric"
                                oninput="updateGroupDate(${index}, this.value)"
                                class="w-24 rounded border border-slate-800 bg-slate-900 px-2 py-1 text-center text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                                title="設定日期">
                            ${weekday ? `<span class="text-xs font-medium text-blue-400">(${weekday})</span>` : ""}
                        </div>
                    </div>
                `;
            }).join("");

            const area = document.getElementById("teams-area");
            area.innerHTML = renderTeam("team1", "第一隊", "⚔️") +
                             renderTeam("team2", "第二隊", "⚔️") +
                             renderPool();

            initSortables();
        }

        loadInitialState();
    </script>
</body>
