                        請直接貼上格式化名單，例如：

                            等級 職業 名字 位置

                        <br>

                            等級 職業 名字 位置

等級 職業 名字 位置

                        <p>5. 可以從共用名單分配到目前團的 1隊／2隊。</p>
                        <p>6. 切換團時，共用名單不會改變。</p>

    <!-- =========================================================
         Firebase SDK
    ========================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


    <script>

        /* =========================================================
           Firebase 設定
        ========================================================== */

        const firebaseConfig = {

            apiKey: "AIzaSyCb4unyxOqVMPA8ZPB7GOp6ugqdXz3p0JM",

            authDomain: "artale-21938.firebaseapp.com",

            databaseURL:
                "https://artale-21938-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId: "artale-21938",

            storageBucket:
                "artale-21938.firebasestorage.app",

            messagingSenderId:
                "532854932886",

            appId:
                "1:532854932886:web:3bdd0ab90b230264abc9b7"

        };


        const FIREBASE_PATH =
            "artale_ryuou_shared_state";


        const STORAGE_KEY =
            "artale_ryuou_groups_state_v5";


        const MAX_GROUPS = 5;

        const MAX_TEAM_SIZE = 6;


        let database = null;

        let firebaseEnabled = false;

        let isRemoteUpdate = false;


        /* =========================================================
           Firebase 初始化
        ========================================================== */

        try {

            if (
                firebaseConfig.apiKey &&
                !firebaseConfig.apiKey.startsWith("請填入")
            ) {

                firebase.initializeApp(firebaseConfig);

                database =
                    firebase.database();

                firebaseEnabled = true;

            }

        } catch (error) {

            console.error(
                "Firebase 初始化失敗：",
                error
            );

            firebaseEnabled = false;

        }


        /* =========================================================
           建立空團
        ========================================================== */

        function emptyGroup() {

            return {

                team1: [],

                team2: [],

                time: "",

                date: ""

            };

        }


        /* =========================================================
           建立預設 5 團
        ========================================================== */

        function createDefaultGroups() {

            return [

                emptyGroup(),

                emptyGroup(),

                emptyGroup(),

                emptyGroup(),

                emptyGroup()

            ];

        }


        /* =========================================================
           全域 State
        ========================================================== */

        let state = {

            activeGroup: 0,

            pool: [],

            groups: createDefaultGroups()

        };


        /* =========================================================
           資料格式整理
           
           ★ 這裡是本次最重要的修正
           
           Firebase 的空陣列可能會變成 null / 不存在。
           舊版程式會因為 pool 不是 Array，
           直接把整份資料重設成空白。
        ========================================================== */

        function normalizeState(data) {

            /*
             * Firebase 沒有任何資料
             */
            if (
                !data ||
                typeof data !== "object"
            ) {

                return {

                    activeGroup: 0,

                    pool: [],

                    groups: createDefaultGroups()

                };

            }


            /*
             * groups 不存在時才建立預設團
             */
            if (
                !Array.isArray(data.groups)
            ) {

                data.groups =
                    createDefaultGroups();

            }


            /*
             * 最多 5 團
             */
            data.groups =
                data.groups.slice(
                    0,
                    MAX_GROUPS
                );


            /*
             * 不足 5 團就補滿
             */
            while (
                data.groups.length < MAX_GROUPS
            ) {

                data.groups.push(
                    emptyGroup()
                );

            }


            /*
             * ★ 重要
             *
             * pool 不存在 / null
             * 只代表「目前沒有待分配玩家」。
             *
             * 絕對不能因此重設整份 state。
             */
            if (
                !Array.isArray(data.pool)
            ) {

                data.pool = [];

            }


            /*
             * activeGroup 防呆
             */
            if (
                typeof data.activeGroup !== "number" ||
                data.activeGroup < 0 ||
                data.activeGroup >= data.groups.length
            ) {

                data.activeGroup = 0;

            }


            /*
             * 整理每一團
             */
            data.groups.forEach(
                (group, index) => {

                    /*
                     * 團資料異常
                     */
                    if (
                        !group ||
                        typeof group !== "object"
                    ) {

                        data.groups[index] =
                            emptyGroup();

                        return;

                    }


                    /*
                     * 第一隊
                     */
                    if (
                        !Array.isArray(group.team1)
                    ) {

                        group.team1 = [];

                    }


                    /*
                     * 第二隊
                     */
                    if (
                        !Array.isArray(group.team2)
                    ) {

                        group.team2 = [];

                    }


                    /*
                     * 時間
                     */
                    if (
                        typeof group.time !== "string"
                    ) {

                        group.time = "";

                    }


                    /*
                     * 日期
                     */
                    if (
                        typeof group.date !== "string"
                    ) {

                        group.date = "";

                    }

                }
            );


            return data;

        }


        /* =========================================================
           目前團
        ========================================================== */

        function currentGroup() {

            return state.groups[
                state.activeGroup
            ];

        }


        /* =========================================================
           Firebase / LocalStorage 儲存
        ========================================================== */

        function saveState() {

            /*
             * 避免 Firebase value 事件再次觸發時，
             * 反向把資料寫回 Firebase。
             */
            if (isRemoteUpdate) {

                return;

            }


            if (firebaseEnabled) {

                database
                    .ref(FIREBASE_PATH)
                    .set(state)
                    .catch(error => {

                        console.error(
                            "Firebase 儲存失敗：",
                            error
                        );

                        alert(
                            "共用資料儲存失敗，請確認 Firebase Database 設定。"
                        );

                    });

            } else {

                /*
                 * Firebase 不可用時，
                 * 使用 localStorage。
                 */
                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(state)
                    );

                } catch (error) {

                    console.error(
                        "LocalStorage 儲存失敗：",
                        error
                    );

                }

            }


            /*
             * 本地操作後立即更新畫面
             */
            render();

        }


        /* =========================================================
           載入初始資料
        ========================================================== */

        function loadInitialState() {

            /*
             * Firebase 未啟用
             */
            if (!firebaseEnabled) {

                try {

                    const saved =
                        JSON.parse(
                            localStorage.getItem(
                                STORAGE_KEY
                            ) || "null"
                        );


                    state =
                        normalizeState(saved);

                } catch (error) {

                    console.error(
                        "讀取 LocalStorage 失敗：",
                        error
                    );

                    state =
                        normalizeState(null);

                }


                render();

                return;

            }


            /*
             * Firebase 即時同步
             */
            database
                .ref(FIREBASE_PATH)
                .on(

                    "value",

                    snapshot => {

                        const data =
                            snapshot.val();


                        /*
                         * Firebase 有資料
                         */
                        if (data) {

                            isRemoteUpdate = true;


                            state =
                                normalizeState(data);


                            render();


                            isRemoteUpdate = false;

                        }

                        /*
                         * Firebase 第一次沒有資料
                         */
                        else {

                            /*
                             * 第一次建立資料。
                             *
                             * 這裡只在 Firebase 完全沒有
                             * 任何資料時執行。
                             */
                            database
                                .ref(FIREBASE_PATH)
                                .set(state)
                                .catch(error => {

                                    console.error(
                                        "Firebase 初始建立失敗：",
                                        error
                                    );

                                });

                            render();

                        }

                    },

                    error => {

                        console.error(
                            "Firebase 同步失敗：",
                            error
                        );

                        /*
                         * ★ 不要因為 Firebase 錯誤
                         * 就把畫面資料清空。
                         */
                        alert(
                            "Firebase 同步失敗，請確認網路或 Firebase Database 設定。"
                        );

                    }

                );

        }


        /* =========================================================
           新增團
        ========================================================== */

        function addGroup() {

            if (
                state.groups.length >= MAX_GROUPS
            ) {

                alert(
                    "目前已經有 5 團。"
                );

                return;

            }


            state.groups.push(
                emptyGroup()
            );


            state.activeGroup =
                state.groups.length - 1;


            saveState();

        }


        /* =========================================================
           減少團
        ========================================================== */

        function removeGroup() {

            if (
                state.groups.length <= 1
            ) {

                alert(
                    "至少要保留 1 團。"
                );

                return;

            }


            const index =
                state.activeGroup;


            const group =
                state.groups[index];


            const total =
                group.team1.length +
                group.team2.length;


            /*
             * 如果該團有人，
             * 必須確認。
             */
            if (
                total > 0 &&
                !confirm(
                    `第 ${index + 1} 團目前有 ${total} 人，確定要刪除這一團嗎？`
                )
            ) {

                return;

            }


            /*
             * 被刪除團的玩家
             * 回到共用名單
             */
            state.pool.push(
                ...group.team1
            );


            state.pool.push(
                ...group.team2
            );


            /*
             * 刪除團
             */
            state.groups.splice(
                index,
                1
            );


            /*
             * 修正目前團索引
             */
            if (
                state.activeGroup >=
                state.groups.length
            ) {

                state.activeGroup =
                    state.groups.length - 1;

            }


            saveState();

        }


        /* =========================================================
           選擇團
        ========================================================== */

        function selectGroup(index) {

            if (
                index < 0 ||
                index >= state.groups.length
            ) {

                return;

            }


            state.activeGroup =
                index;


            saveState();

        }


        /* =========================================================
           更新團隊時間
        ========================================================== */

        function updateGroupTime(
            index,
            time
        ) {

            if (
                !state.groups[index]
            ) {

                return;

            }


            time =
                time.trim();


            const match =
                time.match(
                    /^([01]\d|2[0-3]):([0-5]\d)$/
                );


            if (
                time !== "" &&
                !match
            ) {

                alert(
                    "時間格式請輸入 HH:MM，例如 19:30"
                );

                render();

                return;

            }


            state.groups[index].time =
                time;


            saveState();

        }


        /* =========================================================
           更新團隊日期
        ========================================================== */

        function updateGroupDate(
            index,
            date
        ) {

            if (
                !state.groups[index]
            ) {

                return;

            }


            date =
                date.trim();


            /*
             * 允許 M/D
             *
             * 例如：
             * 9/8
             * 9/11
             */
            const match =
                date.match(
                    /^(\d{1,2})\/(\d{1,2})$/
                );


            if (
                date !== "" &&
                !match
            ) {

                alert(
                    "日期格式請輸入 M/D，例如 9/8"
                );

                render();

                return;

            }


            /*
             * 確認月份與日期範圍
             */
            if (date !== "") {

                const month =
                    Number(match[1]);


                const day =
                    Number(match[2]);


                if (
                    month < 1 ||
                    month > 12 ||
                    day < 1 ||
                    day > 31
                ) {

                    alert(
                        "日期格式不正確，例如 9/8"
                    );

                    render();

                    return;

                }

            }


            state.groups[index].date =
                date;


            saveState();

        }


        /* =========================================================
           取得星期
        ========================================================== */

        function getWeekday(date) {

            if (!date) {

                return "";

            }


            const parts =
                date.split("/");


            const month =
                Number(parts[0]);


            const day =
                Number(parts[1]);


            const year =
                new Date().getFullYear();


            const d =
                new Date(
                    year,
                    month - 1,
                    day
                );


            /*
             * 確認日期真的存在
             *
             * 例如：
             * 2/31 → 無效
             */
            if (
                d.getMonth() !== month - 1 ||
                d.getDate() !== day
            ) {

                return "";

            }


            const weekdays = [

                "日",
                "一",
                "二",
                "三",
                "四",
                "五",
                "六"

            ];


            return weekdays[
                d.getDay()
            ];

        }


        /* =========================================================
           匯入名單
        ========================================================== */

        function handleBatchImport() {

            const input =
                document.getElementById(
                    "paste-input"
                );


            const text =
                input.value.trim();


            if (!text) {

                alert(
                    "請先貼上名單。"
                );

                return;

            }


            let addedCount = 0;

            let skippedCount = 0;


            /*
             * 一行一位玩家
             */
            text
                .split(/\r?\n/)
                .forEach(line => {

                    line =
                        line.trim();


                    if (!line) {

                        return;

                    }


                    const parts =
                        line.split(/\s+/);


                    let name = "";

                    let job = "";

                    let position = "";


                    /*
                     * 只有名字
                     */
                    if (
                        parts.length === 1
                    ) {

                        name =
                            parts[0];

                        job =
                            "未填";

                    }


                    /*
                     * 名字 + 職業
                     */
                    else if (
                        parts.length === 2
                    ) {

                        name =
                            parts[0];

                        job =
                            parts[1];

                    }


                    /*
                     * 三欄
                     */
                    else if (
                        parts.length === 3
                    ) {

                        /*
                         * 第一欄是等級
                         *
                         * 等級 職業 名字
                         */
                        if (
                            !isNaN(parts[0])
                        ) {

                            job =
                                parts[1];

                            name =
                                parts[2];

                        }

                        /*
                         * 職業 名字 位置
                         */
                        else {

                            job =
                                parts[0];

                            name =
                                parts[1];

                            position =
                                parts[2];

                        }

                    }


                    /*
                     * 四欄以上
                     */
                    else {

                        /*
                         * 等級 職業 名字 位置...
                         */
                        if (
                            !isNaN(parts[0])
                        ) {

                            job =
                                parts[1];

                            name =
                                parts[2];

                            position =
                                parts
                                    .slice(3)
                                    .join(" ");

                        }

                        /*
                         * 職業 名字 位置...
                         */
                        else {

                            job =
                                parts[0];

                            name =
                                parts[1];

                            position =
                                parts
                                    .slice(2)
                                    .join(" ");

                        }

                    }


                    /*
                     * 沒有名字
                     */
                    if (!name) {

                        skippedCount++;

                        return;

                    }


                    /*
                     * 顯示職業
                     */
                    let displayJob =
                        job;


                    if (position) {

                        displayJob =
                            `${job} (${position})`;

                    }


                    /*
                     * 建立唯一 ID
                     */
                    state.pool.push({

                        id:
                            Date.now() +
                            "-" +
                            Math.random()
                                .toString(36)
                                .substring(2, 10),

                        name:
                            name,

                        job:
                            displayJob

                    });


                    addedCount++;

                });


            /*
             * 清空輸入框
             */
            input.value = "";


            /*
             * 儲存
             */
            saveState();


            /*
             * 顯示結果
             */
            if (
                skippedCount > 0
            ) {

                alert(

                    `成功加入 ${addedCount} 人。\n` +
                    `${skippedCount} 筆資料無法解析。`

                );

            } else {

                alert(

                    `成功加入 ${addedCount} 人到共用待分配名單。`

                );

            }

        }


        /* =========================================================
           移動玩家
        ========================================================== */

        function moveTo(
            index,
            fromGroup,
            toGroup
        ) {

            const group =
                currentGroup();


            if (!group) {

                return;

            }


            let item;


            /*
             * 從共用名單移動
             */
            if (
                fromGroup === "pool"
            ) {

                item =
                    state.pool.splice(
                        index,
                        1
                    )[0];

            }


            /*
             * 從第一隊移動
             */
            else if (
                fromGroup === "team1"
            ) {

                item =
                    group.team1.splice(
                        index,
                        1
                    )[0];

            }


            /*
             * 從第二隊移動
             */
            else if (
                fromGroup === "team2"
            ) {

                item =
                    group.team2.splice(
                        index,
                        1
                    )[0];

            }


            /*
             * 找不到玩家
             */
            if (!item) {

                return;

            }


            /*
             * 回到共用名單
             */
            if (
                toGroup === "pool"
            ) {

                state.pool.push(item);

            }


            /*
             * 移動到第一隊
             */
            else if (
                toGroup === "team1"
            ) {

                if (
                    group.team1.length <
                    MAX_TEAM_SIZE
                ) {

                    group.team1.push(item);

                } else {

                    alert(
                        "第一隊已滿（6人）"
                    );

                    state.pool.push(item);

                }

            }


            /*
             * 移動到第二隊
             */
            else if (
                toGroup === "team2"
            ) {

                if (
                    group.team2.length <
                    MAX_TEAM_SIZE
                ) {

                    group.team2.push(item);

                } else {

                    alert(
                        "第二隊已滿（6人）"
                    );

                    state.pool.push(item);

                }

            }


            /*
             * 儲存
             */
            saveState();

        }


        /* =========================================================
           清空目前團
        ========================================================== */

        function clearCurrentGroup() {

            const group =
                currentGroup();


            if (!group) {

                return;

            }


            const total =
                group.team1.length +
                group.team2.length;


            if (
                !confirm(

                    `確定要清空第 ${state.activeGroup + 1} 團嗎？\n\n` +

                    `目前共有 ${total} 人。\n` +

                    `這些玩家會回到「共用待分配名單」。`

                )
            ) {

                return;

            }


            /*
             * 玩家回到共用名單
             */
            state.pool.push(

                ...group.team1,

                ...group.team2

            );


            /*
             * 重設該團
             */
            state.groups[
                state.activeGroup
            ] = emptyGroup();


            /*
             * 儲存
             */
            saveState();

        }


        /* =========================================================
           清空全部資料
        ========================================================== */

        function clearAllData() {

            if (

                !confirm(

                    "確定要清空全部資料嗎？\n\n" +

                    "包含：\n" +

                    "• 共用待分配名單\n" +

                    "• 第 1～5 團\n" +

                    "• 所有第一隊／第二隊\n" +

                    "• 各團設定的日期\n" +

                    "• 各團設定的時間"

                )

            ) {

                return;

            }


            state = {

                activeGroup: 0,

                pool: [],

                groups:
                    createDefaultGroups()

            };


            saveState();

        }


        /* =========================================================
           成員卡片
        ========================================================== */

        function memberCard(
            player,
            index,
            teamName
        ) {

            const color =
                teamName === "team1"
                    ? "sky"
                    : "rose";


            const arrow =
                teamName === "team1"
                    ? "➡️"
                    : "⬅️";


            const target =
                teamName === "team1"
                    ? "team2"
                    : "team1";


            const title =
                teamName === "team1"
                    ? "移至第二隊"
                    : "移至第一隊";


            return `

                <div
                    class="bg-slate-900/80 border border-${color}-500/30 rounded-lg p-3 flex justify-between items-center shadow">

                    <div class="min-w-0 pr-2">

                        <span
                            class="text-xs text-${color}-400 font-bold mr-1.5">

                            #${index + 1}

                        </span>


                        <span
                            class="font-bold text-slate-100">

                            ${escapeHtml(player.name)}

                        </span>


                        <span
                            class="text-xs text-slate-300 ml-1.5 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">

                            ${escapeHtml(player.job)}

                        </span>

                    </div>


                    <div class="flex gap-1 shrink-0">

                        <button
                            onclick="moveTo(${index}, '${teamName}', '${target}')"
                            title="${title}"
                            class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300">

                            ${arrow}

                        </button>


                        <button
                            onclick="moveTo(${index}, '${teamName}', 'pool')"
                            title="退回共用待分配名單"
                            class="text-xs bg-rose-900/60 hover:bg-rose-800 px-2 py-1 rounded text-rose-200">

                            ❌

                        </button>

                    </div>

                </div>

            `;

        }


        /* =========================================================
           顯示隊伍
        ========================================================== */

        function renderTeam(
            teamName,
            title,
            emoji,
            color
        ) {

            const group =
                currentGroup();


            const members =
                group[teamName];


            let html = `

                <div
                    class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">

                    <div
                        class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">

                        <h2
                            class="text-xl font-bold text-${color}-400 flex items-center gap-2">

                            <span>
                                ${emoji}
                            </span>

                            ${title}

                            <span
                                class="text-sm font-normal text-slate-400">

                                (上限 6 人)

                            </span>

                        </h2>


                        <span
                            class="bg-${color}-900 text-${color}-200 text-xs px-2.5 py-1 rounded-full font-semibold">

                            ${members.length} / 6

                        </span>

                    </div>


                    <div
                        class="grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[120px]">

            `;


            /*
             * 固定顯示 6 格
             */
            for (
                let i = 0;
                i < MAX_TEAM_SIZE;
                i++
            ) {

                if (
                    i < members.length
                ) {

                    html +=
                        memberCard(
                            members[i],
                            i,
                            teamName
                        );

                } else {

                    html += `

                        <div
                            class="border border-dashed border-slate-700 rounded-lg p-3 flex items-center justify-center text-slate-600 text-xs">

                            (空位)

                        </div>

                    `;

                }

            }


            html += `

                    </div>

                </div>

            `;


            return html;

        }


        /* =========================================================
           共用待分配名單
        ========================================================== */

        function renderPool() {

            let html = `

                <div
                    class="bg-slate-800 border border-amber-500/30 rounded-xl p-5 shadow-lg">

                    <div
                        class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">

                        <div>

                            <h2
                                class="text-xl font-bold text-amber-400 flex items-center gap-2">

                                <span>
                                    👥
                                </span>

                                共用待分配名單

                            </h2>


                            <p
                                class="text-xs text-slate-500 mt-1">

                                第 1～5 團共用同一份名單

                            </p>

                        </div>


                        <span
                            class="bg-amber-900 text-amber-200 text-xs px-2.5 py-1 rounded-full font-semibold">

                            ${state.pool.length} 人

                        </span>

                    </div>


                    <div
                        class="flex flex-wrap gap-2 min-h-[80px]">

            `;


            /*
             * 沒有待分配玩家
             */
            if (
                state.pool.length === 0
            ) {

                html += `

                    <p
                        class="text-slate-500 text-sm italic py-2">

                        目前沒有待分配成員。

                    </p>

                `;

            }


            /*
             * 顯示玩家
             */
            else {

                state.pool.forEach(
                    (player, index) => {

                        html += `

                            <div
                                class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 flex items-center gap-2 text-sm shadow">

                                <div>

                                    <span
                                        class="font-semibold text-slate-200">

                                        ${escapeHtml(player.name)}

                                    </span>


                                    <span
                                        class="text-xs text-slate-300 ml-1 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">

                                        ${escapeHtml(player.job)}

                                    </span>

                                </div>


                                <div
                                    class="flex gap-1 ml-2">

                                    <button
                                        onclick="moveTo(${index}, 'pool', 'team1')"
                                        class="text-xs bg-sky-900 hover:bg-sky-800 text-sky-200 px-1.5 py-0.5 rounded">

                                        1隊

                                    </button>


                                    <button
                                        onclick="moveTo(${index}, 'pool', 'team2')"
                                        class="text-xs bg-rose-900 hover:bg-rose-800 text-rose-200 px-1.5 py-0.5 rounded">

                                        2隊

                                    </button>

                                </div>

                            </div>

                        `;

                    }
                );

            }


            html += `

                    </div>

                </div>

            `;


            return html;

        }


        /* =========================================================
           HTML 安全處理
        ========================================================== */

        function escapeHtml(value) {

            return String(value)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        /* =========================================================
           整體畫面 Render
        ========================================================== */

        function render() {

            /*
             * 確保 state 結構正常
             */
            state =
                normalizeState(state);


            const count =
                state.groups.length;


            /*
             * 團數
             */
            document
                .getElementById(
                    "group-count"
                )
                .innerText =
                    `${count} / 5`;


            /*
             * 頁面摘要
             */
            document
                .getElementById(
                    "summary"
                )
                .innerText =

                    `目前 ${count} 團・每團 12 人（第一隊 6 人、第二隊 6 人）・共用待分配 ${state.pool.length} 人`;


            /* =====================================================
               團隊按鈕
            ====================================================== */

            const tabs =
                document.getElementById(
                    "group-tabs"
                );


            tabs.innerHTML =
                state.groups
                    .map(
                        (group, index) => {

                            const weekday =
                                getWeekday(
                                    group.date
                                );


                            return `

                                <div
                                    class="flex flex-col items-center gap-1">

                                    <!-- 團數按鈕 -->

                                    <button
                                        onclick="selectGroup(${index})"
                                        class="px-4 py-2 rounded-lg font-semibold text-sm transition

                                        ${
                                            index === state.activeGroup

                                                ? "bg-amber-500 text-slate-950 shadow-md"

                                                : "bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700"
                                        }">

                                        第 ${index + 1} 團

                                    </button>


                                    <!-- 時間 -->

                                    <input
                                        type="text"
                                        value="${escapeHtml(group.time || "")}"
                                        placeholder="19:30"
                                        maxlength="5"
                                        inputmode="numeric"
                                        onchange="updateGroupTime(${index}, this.value)"
                                        class="w-24 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-sm text-slate-200 text-center focus:outline-none focus:border-amber-500"
                                        title="設定第 ${index + 1} 團時間">


                                    <!-- 日期 -->

                                    <div
                                        class="flex items-center gap-1">

                                        <input
                                            type="text"
                                            value="${escapeHtml(group.date || "")}"
                                            placeholder="9/8"
                                            maxlength="5"
                                            inputmode="numeric"
                                            onchange="updateGroupDate(${index}, this.value)"
                                            class="w-24 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-sm text-slate-200 text-center focus:outline-none focus:border-amber-500"
                                            title="設定第 ${index + 1} 團日期">


                                        ${
                                            weekday

                                                ? `

                                                    <span
                                                        class="text-xs text-amber-400 font-semibold whitespace-nowrap">

                                                        (${weekday})

                                                    </span>

                                                  `

                                                : ""
                                        }

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");


            /* =====================================================
               隊伍區域
            ====================================================== */

            const area =
                document.getElementById(
                    "teams-area"
                );


            area.innerHTML =

                renderTeam(
                    "team1",
                    "第一隊",
                    "⚔️",
                    "sky"
                )

                +

                renderTeam(
                    "team2",
                    "第二隊",
                    "⚔️",
                    "rose"
                )

                +

                renderPool();

        }


        /* =========================================================
           啟動
           
           ★ 不再先 render() 再載入 Firebase
           ★ 先載入資料，再 render()
        ========================================================== */

        loadInitialState();

    </script>

</body>

</html>
