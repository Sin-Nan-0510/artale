<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 隊伍分配</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* =====================================================
           分享圖片產生區
        ====================================================== */

        #share-card {
            position: fixed;
            left: -100000px;
            top: 0;
            width: 1500px;
            pointer-events: none;
        }

        .share-card-inner {
            width: 1500px;
            padding: 70px;
            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(56, 189, 248, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 5%,
                    rgba(245, 158, 11, 0.14),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #08111f 0%,
                    #0f172a 45%,
                    #111827 100%
                );
            color: #f8fafc;
        }

        .share-title {
            text-align: center;
            margin-bottom: 46px;
        }

        .share-title-main {
            font-size: 64px;
            line-height: 1;
            font-weight: 1000;
            letter-spacing: 8px;
            color: #fbbf24;
            text-shadow: 0 4px 0 #713f12;
        }

        .share-title-sub {
            margin-top: 18px;
            font-size: 30px;
            font-weight: 800;
            color: #cbd5e1;
        }

        .share-group {
            margin-bottom: 38px;
            overflow: hidden;
            border: 2px solid #334155;
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.95);
            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .share-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 34px;
            background:
                linear-gradient(
                    90deg,
                    rgba(245, 158, 11, 0.18),
                    rgba(30, 41, 59, 0.85)
                );
            border-bottom: 1px solid #334155;
        }

        .share-group-title {
            font-size: 34px;
            font-weight: 1000;
            color: #f8fafc;
        }

        .share-group-info {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 20px;
            font-weight: 700;
            color: #94a3b8;
        }

        .share-group-count {
            padding: 8px 16px;
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 999px;
            background: rgba(120, 53, 15, 0.35);
            color: #fcd34d;
        }

        .share-teams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 26px;
        }

        .share-team {
            overflow: hidden;
            border: 2px solid;
            border-radius: 20px;
            background: #111827;
        }

        .share-team.team1 {
            border-color: #0284c7;
        }

        .share-team.team2 {
            border-color: #e11d48;
        }

        .share-team-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
        }

        .share-team.team1 .share-team-header {
            background: linear-gradient(135deg, #075985, #0369a1);
        }

        .share-team.team2 .share-team-header {
            background: linear-gradient(135deg, #9f1239, #be123c);
        }

        .share-team-title {
            font-size: 27px;
            font-weight: 1000;
        }

        .share-team.team1 .share-team-title {
            color: #e0f2fe;
        }

        .share-team.team2 .share-team-title {
            color: #ffe4e6;
        }

        .share-team-count {
            font-size: 18px;
            font-weight: 900;
        }

        .share-team.team1 .share-team-count {
            color: #bae6fd;
        }

        .share-team.team2 .share-team-count {
            color: #fecdd3;
        }

        .share-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .share-table th {
            padding: 13px 12px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 800;
            text-align: left;
        }

        .share-table td {
            height: 76px;
            padding: 10px 12px;
            border-bottom: 1px solid #1e293b;
            font-size: 19px;
            font-weight: 700;
            vertical-align: middle;
        }

        .share-table tr:last-child td {
            border-bottom: none;
        }

        .share-table .col-number {
            width: 58px;
            text-align: center;
        }

        .share-table .col-level {
            width: 125px;
            min-width: 125px;
            white-space: nowrap;
        }

        .share-table .col-name {
            width: 190px;
        }

        .share-table .col-job {
            width: 150px;
        }

        .share-table .col-position {
            width: auto;
        }

        .share-number {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 1000;
        }

        .share-team.team1 .share-number {
            background: #0369a1;
            color: #e0f2fe;
        }

        .share-team.team2 .share-number {
            background: #be123c;
            color: #ffe4e6;
        }

        .share-level {
            color: #fbbf24;
            font-weight: 900;
        }

        .share-level-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            padding: 8px 12px;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            background: rgba(120, 53, 15, 0.65);
            color: #fcd34d;
            font-size: 20px;
            line-height: 1;
            font-weight: 1000;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .share-level-missing {
            color: #64748b;
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
        }

        .share-name {
            color: #f8fafc;
            font-weight: 1000;
        }

        .share-job {
            color: #cbd5e1;
        }

        .share-position {
            color: #94a3b8;
        }

        .share-empty-row td {
            color: #475569;
            font-style: italic;
            text-align: center;
        }

        .share-footer {
            margin-top: 12px;
            padding-top: 26px;
            border-top: 1px solid #334155;
            text-align: center;
            color: #64748b;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 p-4 text-slate-100 md:p-8">

    <div class="mx-auto max-w-7xl">

        <!-- =====================================================
             標題
        ====================================================== -->

        <header class="mb-6 text-center">
            <h1 class="mb-2 text-3xl font-bold tracking-wider text-amber-400 md:text-4xl">
                Artale 隊伍分配
            </h1>

            <!-- 保留給 JS 使用，但不顯示 -->
            <p id="summary" class="hidden"></p>
        </header>


        <!-- =====================================================
             團數控制
        ====================================================== -->

        <div class="mb-6 rounded-xl border border-slate-700 bg-slate-800 p-4 shadow-lg">

            <div class="flex flex-wrap items-center justify-between gap-3">

                <div>
                    <h2 class="text-lg font-bold text-amber-400">
                        🗂️ 遠征團管理
                    </h2>
                </div>

                <div class="flex items-center gap-2">

                    <button
                        onclick="removeGroup()"
                        class="rounded-lg bg-slate-700 px-4 py-2 font-semibold transition hover:bg-slate-600">
                        ➖ 減少一團
                    </button>

                    <span
                        id="group-count"
                        class="min-w-16 rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-center font-bold">
                        5 / 5
                    </span>

                    <button
                        onclick="addGroup()"
                        class="rounded-lg bg-emerald-600 px-4 py-2 font-semibold transition hover:bg-emerald-500">
                        ➕ 新增一團
                    </button>

                </div>
            </div>

            <div id="group-tabs" class="mt-4 flex flex-wrap gap-4"></div>

        </div>


        <!-- =====================================================
             主內容
        ====================================================== -->

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

            <!-- 左側：隊伍 -->

            <div id="teams-area" class="space-y-6 lg:col-span-2"></div>


            <!-- 右側：控制 -->

            <div class="space-y-6">

                <div class="sticky top-6 rounded-xl border border-slate-700 bg-slate-800 p-5 shadow-lg">

                    <h2 class="mb-3 flex items-center gap-2 text-lg font-bold text-emerald-400">
                        <span>📋</span>
                        快速貼上與匯入
                    </h2>


                    <!-- 只保留格式 -->

                    <div class="mb-3 rounded-lg border border-emerald-500/20 bg-slate-900/70 px-3 py-2 text-center font-mono text-sm font-semibold tracking-wide text-emerald-300">
                        等級　職業　名字　位置
                    </div>


                    <textarea
                        id="paste-input"
                        rows="8"
                        class="mb-3 w-full resize-none rounded-lg border border-slate-700 bg-slate-900 p-3 font-mono text-sm text-slate-200 focus:border-emerald-500 focus:outline-none"
                        placeholder="等級　職業　名字　位置"></textarea>


                    <button
                        onclick="handleBatchImport()"
                        class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white shadow-md transition hover:bg-emerald-500">
                        ➕ 加入共用待分配名單
                    </button>


                    <hr class="my-5 border-slate-700">


                    <!-- =================================================
                         全部團隊圖片
                    ================================================== -->

                    <button
                        onclick="generateAllTeamsImage()"
                        class="w-full rounded-lg bg-amber-500 px-4 py-3 font-bold text-slate-950 shadow-md transition hover:bg-amber-400">
                        📸 產生全部團隊圖片
                    </button>


                    <button
                        onclick="clearCurrentGroup()"
                        class="mt-5 w-full rounded-lg border border-rose-700 bg-rose-900/50 px-4 py-2.5 text-sm font-semibold text-rose-200 transition hover:bg-rose-900">
                        🗑️ 清空目前團
                    </button>


                    <button
                        onclick="clearAllData()"
                        class="mt-3 w-full rounded-lg border border-slate-600 bg-slate-700 px-4 py-2.5 text-sm font-semibold text-slate-200 transition hover:bg-slate-600">
                        🗑️ 清空全部
                    </button>

                </div>

            </div>
        </div>
    </div>


    <!-- =========================================================
         團隊圖片產生區
    ========================================================== -->

    <div id="share-card"></div>


    <!-- =========================================================
         Firebase
    ========================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>

        /* =========================================================
           Firebase 設定
        ========================================================== */

        const firebaseConfig = {
            apiKey: "AIzaSyCb4unyxOqVMPA8ZPB7GOp6ugqdXz3p0JM",
            authDomain: "artale-21938.firebaseapp.com",
            databaseURL: "https://artale-21938-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "artale-21938",
            storageBucket: "artale-21938.firebasestorage.app",
            messagingSenderId: "532854932886",
            appId: "1:532854932886:web:3bdd0ab90b230264abc9b7"
        };

        const FIREBASE_PATH = "artale_ryuou_shared_state";
        const STORAGE_KEY = "artale_ryuou_groups_state_v6";

        const MAX_GROUPS = 5;
        const MAX_TEAM_SIZE = 6;

        let database = null;
        let firebaseEnabled = false;
        let isRemoteUpdate = false;


        /* =========================================================
           Firebase 初始化
        ========================================================== */

        try {

            if (
                firebaseConfig.apiKey &&
                !firebaseConfig.apiKey.startsWith("請填入")
            ) {

                firebase.initializeApp(
                    firebaseConfig
                );

                database =
                    firebase.database();

                firebaseEnabled = true;
            }

        } catch (error) {

            console.error(
                "Firebase 初始化失敗：",
                error
            );

            firebaseEnabled = false;
        }


        /* =========================================================
           空團
        ========================================================== */

        function emptyGroup() {

            return {
                team1: [],
                team2: [],
                time: "",
                date: ""
            };

        }


        /* =========================================================
           預設 5 團
        ========================================================== */

        function createDefaultGroups() {

            return Array.from(
                {
                    length: MAX_GROUPS
                },
                () => emptyGroup()
            );

        }


        /* =========================================================
           State
        ========================================================== */

        let state = {

            activeGroup: 0,

            pool: [],

            groups:
                createDefaultGroups()

        };


        /* =========================================================
           等級判斷
        ========================================================== */

        function isLevel(value) {

            return /^(?:lv\.?\s*)?\d+$/i.test(
                String(value || "").trim()
            );

        }


        /* =========================================================
           標準化等級
        ========================================================== */

        function normalizeLevel(value) {

            const text =
                String(value || "").trim();

            const match =
                text.match(/\d+/);

            return match
                ? match[0]
                : "";

        }


        /* =========================================================
           取得玩家等級
        ========================================================== */

        function getPlayerLevel(player) {

            if (!player) {
                return "";
            }

            const possibleFields = [

                player.level,

                player.lv,

                player["等級"],

                player.levelText,

                player.levelDisplay,

                player.levelNumber,

                player.levelValue,

                player["等級數字"]

            ];


            for (
                const value of possibleFields
            ) {

                if (isLevel(value)) {

                    const level =
                        normalizeLevel(
                            value
                        );

                    if (level) {
                        return level;
                    }
                }
            }


            return "";

        }


        /* =========================================================
           玩家資料標準化
        ========================================================== */

        function normalizePlayer(player) {

            if (
                !player ||
                typeof player !== "object"
            ) {

                return null;
            }


            const result = {

                id:
                    player.id ||
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2, 10),

                level:
                    getPlayerLevel(
                        player
                    ),

                name:
                    String(
                        player.name ||
                        player["名稱"] ||
                        player["名字"] ||
                        ""
                    ).trim(),

                job:
                    String(
                        player.job ||
                        player["職業"] ||
                        "未填"
                    ).trim(),

                position:
                    String(
                        player.position ||
                        player["位置"] ||
                        ""
                    ).trim()

            };


            /* -----------------------------------------------------
               相容舊版：
               舊資料可能是「法師 (主力)」
            ------------------------------------------------------ */

            if (
                !player.position &&
                !player["位置"] &&
                result.job
            ) {

                const match =
                    result.job.match(
                        /^(.*?)\s*\((.*?)\)\s*$/
                    );


                if (match) {

                    result.job =
                        match[1].trim();

                    result.position =
                        match[2].trim();

                }

            }


            return result;

        }


        /* =========================================================
           資料格式整理
        ========================================================== */

        function normalizeState(data) {

            if (
                !data ||
                typeof data !== "object"
            ) {

                return {

                    activeGroup: 0,

                    pool: [],

                    groups:
                        createDefaultGroups()

                };

            }


            let groups =
                Array.isArray(data.groups)
                    ? data.groups.slice(
                        0,
                        MAX_GROUPS
                    )
                    : [];


            /*
             * 不再強制補回 5 團。
             */

            if (
                groups.length === 0
            ) {

                groups =
                    createDefaultGroups();

            }


            const pool =
                Array.isArray(data.pool)
                    ? data.pool
                        .map(
                            normalizePlayer
                        )
                        .filter(Boolean)
                    : [];


            groups =
                groups.map(group => {

                    if (
                        !group ||
                        typeof group !== "object"
                    ) {

                        return emptyGroup();

                    }


                    return {

                        team1:
                            Array.isArray(
                                group.team1
                            )
                                ? group.team1
                                    .map(
                                        normalizePlayer
                                    )
                                    .filter(Boolean)
                                : [],

                        team2:
                            Array.isArray(
                                group.team2
                            )
                                ? group.team2
                                    .map(
                                        normalizePlayer
                                    )
                                    .filter(Boolean)
                                : [],

                        time:
                            typeof group.time === "string"
                                ? group.time
                                : "",

                        date:
                            typeof group.date === "string"
                                ? group.date
                                : ""

                    };

                });


            let activeGroup =
                typeof data.activeGroup === "number"
                    ? data.activeGroup
                    : 0;


            if (
                activeGroup < 0 ||
                activeGroup >= groups.length
            ) {

                activeGroup = 0;

            }


            return {

                activeGroup,

                pool,

                groups

            };

        }


        /* =========================================================
           目前團
        ========================================================== */

        function currentGroup() {

            return state.groups[
                state.activeGroup
            ];

        }


        /* =========================================================
           儲存
        ========================================================== */

        function saveState() {

            if (isRemoteUpdate) {
                return;
            }


            if (firebaseEnabled) {

                database
                    .ref(FIREBASE_PATH)
                    .set(state)
                    .catch(error => {

                        console.error(
                            "Firebase 儲存失敗：",
                            error
                        );

                        alert(
                            "共用資料儲存失敗，請確認 Firebase Database 設定。"
                        );

                    });

            } else {

                try {

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(state)
                    );

                } catch (error) {

                    console.error(
                        "LocalStorage 儲存失敗：",
                        error
                    );

                }

            }


            render();

        }


        /* =========================================================
           初始資料
        ========================================================== */

        function loadInitialState() {

            if (!firebaseEnabled) {

                try {

                    const saved =
                        JSON.parse(
                            localStorage.getItem(
                                STORAGE_KEY
                            ) || "null"
                        );


                    state =
                        normalizeState(
                            saved
                        );

                } catch (error) {

                    console.error(
                        "讀取 LocalStorage 失敗：",
                        error
                    );

                    state =
                        normalizeState(null);

                }


                render();

                return;

            }


            database
                .ref(FIREBASE_PATH)
                .on(
                    "value",
                    snapshot => {

                        const data =
                            snapshot.val();


                        if (data) {

                            isRemoteUpdate = true;

                            state =
                                normalizeState(
                                    data
                                );

                            render();

                            isRemoteUpdate = false;

                        } else {

                            database
                                .ref(FIREBASE_PATH)
                                .set(state)
                                .catch(error => {

                                    console.error(
                                        "Firebase 初始建立失敗：",
                                        error
                                    );

                                });

                            render();

                        }

                    },

                    error => {

                        console.error(
                            "Firebase 同步失敗：",
                            error
                        );

                        alert(
                            "Firebase 同步失敗，請確認網路或 Firebase Database 設定。"
                        );

                    }
                );

        }


        /* =========================================================
           新增團
        ========================================================== */

        function addGroup() {

            if (
                state.groups.length >=
                MAX_GROUPS
            ) {

                alert(
                    "目前已經有 5 團。"
                );

                return;

            }


            state.groups.push(
                emptyGroup()
            );


            state.activeGroup =
                state.groups.length - 1;


            saveState();

        }


        /* =========================================================
           減少團
        ========================================================== */

        function removeGroup() {

            if (
                state.groups.length <= 1
            ) {

                alert(
                    "至少要保留 1 團。"
                );

                return;

            }


            const index =
                state.activeGroup;

            const group =
                state.groups[index];


            const total =
                group.team1.length +
                group.team2.length;


            if (
                total > 0 &&
                !confirm(
                    `第 ${index + 1} 團目前有 ${total} 人，確定要刪除這一團嗎？`
                )
            ) {

                return;

            }


            state.pool.push(
                ...group.team1,
                ...group.team2
            );


            state.groups.splice(
                index,
                1
            );


            if (
                state.activeGroup >=
                state.groups.length
            ) {

                state.activeGroup =
                    state.groups.length - 1;

            }


            saveState();

        }


        /* =========================================================
           選擇團
        ========================================================== */

        function selectGroup(index) {

            if (
                index < 0 ||
                index >= state.groups.length
            ) {

                return;

            }


            state.activeGroup =
                index;


            saveState();

        }


        /* =========================================================
           更新時間
        ========================================================== */

        function updateGroupTime(
            index,
            time
        ) {

            if (!state.groups[index]) {
                return;
            }


            time = time.trim();


            const match =
                time.match(
                    /^([01]\d|2[0-3]):([0-5]\d)$/
                );


            if (
                time !== "" &&
                !match
            ) {

                alert(
                    "時間格式請輸入 HH:MM，例如 19:30"
                );

                render();

                return;

            }


            state.groups[index].time =
                time;


            saveState();

        }


        /* =========================================================
           更新日期
        ========================================================== */

        function updateGroupDate(
            index,
            date
        ) {

            if (!state.groups[index]) {
                return;
            }


            date = date.trim();


            const match =
                date.match(
                    /^(\d{1,2})\/(\d{1,2})$/
                );


            if (
                date !== "" &&
                !match
            ) {

                alert(
                    "日期格式請輸入 M/D，例如 9/8"
                );

                render();

                return;

            }


            if (date !== "") {

                const month =
                    Number(match[1]);

                const day =
                    Number(match[2]);


                if (
                    month < 1 ||
                    month > 12 ||
                    day < 1 ||
                    day > 31
                ) {

                    alert(
                        "日期格式不正確，例如 9/8"
                    );

                    render();

                    return;

                }

            }


            state.groups[index].date =
                date;


            saveState();

        }


        /* =========================================================
           星期
        ========================================================== */

        function getWeekday(date) {

            if (!date) {
                return "";
            }


            const parts =
                date.split("/");


            const month =
                Number(parts[0]);

            const day =
                Number(parts[1]);


            const year =
                new Date().getFullYear();


            const d =
                new Date(
                    year,
                    month - 1,
                    day
                );


            if (
                d.getMonth() !== month - 1 ||
                d.getDate() !== day
            ) {

                return "";

            }


            const weekdays = [
                "日",
                "一",
                "二",
                "三",
                "四",
                "五",
                "六"
            ];


            return weekdays[
                d.getDay()
            ];

        }


        /* =========================================================
           匯入名單
        ========================================================== */

        function handleBatchImport() {

            const input =
                document.getElementById(
                    "paste-input"
                );


            const text =
                input.value.trim();


            if (!text) {

                alert(
                    "請先貼上名單。"
                );

                return;

            }


            let addedCount = 0;
            let skippedCount = 0;


            text
                .split(/\r?\n/)
                .forEach(line => {

                    line = line.trim();


                    if (!line) {
                        return;
                    }


                    const parts =
                        line.split(/\s+/);


                    const headerText =
                        parts.join("");


                    if (
                        headerText.includes("等級") &&
                        headerText.includes("職業")
                    ) {

                        return;

                    }


                    let level = "";
                    let name = "";
                    let job = "";
                    let position = "";


                    /* 1 欄 */

                    if (
                        parts.length === 1
                    ) {

                        name =
                            parts[0];

                        job =
                            "未填";


                    /* 2 欄 */

                    } else if (
                        parts.length === 2
                    ) {

                        name =
                            parts[0];

                        job =
                            parts[1];


                    /* 3 欄 */

                    } else if (
                        parts.length === 3
                    ) {

                        if (
                            isLevel(parts[0])
                        ) {

                            level =
                                normalizeLevel(
                                    parts[0]
                                );

                            job =
                                parts[1];

                            name =
                                parts[2];

                        } else {

                            job =
                                parts[0];

                            name =
                                parts[1];

                            position =
                                parts[2];

                        }


                    /* 4 欄以上 */

                    } else {

                        if (
                            isLevel(parts[0])
                        ) {

                            level =
                                normalizeLevel(
                                    parts[0]
                                );

                            job =
                                parts[1];

                            name =
                                parts[2];

                            position =
                                parts
                                    .slice(3)
                                    .join(" ");

                        } else {

                            job =
                                parts[0];

                            name =
                                parts[1];

                            position =
                                parts
                                    .slice(2)
                                    .join(" ");

                        }

                    }


                    if (!name) {

                        skippedCount++;

                        return;

                    }


                    state.pool.push({

                        id:
                            Date.now() +
                            "-" +
                            Math.random()
                                .toString(36)
                                .substring(2, 10),

                        level,

                        name,

                        job:
                            job || "未填",

                        position

                    });


                    addedCount++;

                });


            input.value = "";


            saveState();


            if (
                skippedCount > 0
            ) {

                alert(
                    `成功加入 ${addedCount} 人。\n` +
                    `${skippedCount} 筆資料無法解析。`
                );

            } else {

                alert(
                    `成功加入 ${addedCount} 人到共用待分配名單。`
                );

            }

        }


        /* =========================================================
           移動玩家
        ========================================================== */

        function moveTo(
            index,
            fromGroup,
            toGroup
        ) {

            const group =
                currentGroup();


            if (!group) {
                return;
            }


            let item;


            if (
                fromGroup === "pool"
            ) {

                item =
                    state.pool.splice(
                        index,
                        1
                    )[0];

            } else if (
                fromGroup === "team1"
            ) {

                item =
                    group.team1.splice(
                        index,
                        1
                    )[0];

            } else if (
                fromGroup === "team2"
            ) {

                item =
                    group.team2.splice(
                        index,
                        1
                    )[0];

            }


            if (!item) {
                return;
            }


            if (
                toGroup === "pool"
            ) {

                state.pool.push(
                    item
                );

            } else if (
                toGroup === "team1"
            ) {

                if (
                    group.team1.length <
                    MAX_TEAM_SIZE
                ) {

                    group.team1.push(
                        item
                    );

                } else {

                    alert(
                        "第一隊已滿（6人）"
                    );

                    state.pool.push(
                        item
                    );

                }

            } else if (
                toGroup === "team2"
            ) {

                if (
                    group.team2.length <
                    MAX_TEAM_SIZE
                ) {

                    group.team2.push(
                        item
                    );

                } else {

                    alert(
                        "第二隊已滿（6人）"
                    );

                    state.pool.push(
                        item
                    );

                }

            }


            saveState();

        }

                "undefined"
            ) {

                alert(
                    "圖片工具尚未載入完成，請稍後再試。"
                );

                return;

            }


            const shareCard =
                document.getElementById(

             */

            const activeGroups =
                state.groups
                    .map(

                            originalIndex: index
                        })
                    )
                    .filter(
                        item =>
                            item.group.team1.length > 0 ||
                            item.group.team2.length > 0
                    );

                activeGroups.length === 0
            ) {

                alert(

                );

                    }


                    <div class="share-footer">
                        Artale 隊伍分配 ・ 全部團隊名單
                    </div>

                </div>

            `;


            try {

                await new Promise(
                    resolve =>
                        requestAnimationFrame(
                            resolve
                        )
                );


                const canvas =
                    await html2canvas(
                        shareCard.firstElementChild,
                        {
                            scale: 2,
                            useCORS: true,

                            logging: false,
                            imageTimeout: 0
                        }

                    );

                    today.getFullYear();

                    String(
                        today.getMonth() + 1
                    ).padStart(
                        2,
                        "0"
                    );


                const day =
                    String(
                        today.getDate()
                    ).padStart(
                        2,
                        "0"
                    );


                link.download =
                    `Artale_全部團隊_${year}-${month}-${day}.png`;


                link.href =
                    canvas.toDataURL(
                        "image/png"
                    );


                link.click();


            } catch (error) {

                console.error(
                    "產生全部團隊圖片失敗：",
                    error
                );


                alert(
                    "產生圖片失敗，請稍後再試。"
                );

            }

                                        type="text"
                                        value="${escapeHtml(
                                            group.time || ""
                                        )}"
                                        placeholder="19:30"
                                        maxlength="5"
                                        inputmode="numeric"
                                        onchange="updateGroupTime(${index}, this.value)"
                                        class="w-24 rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 text-center text-sm text-slate-200 focus:border-amber-500 focus:outline-none"
                                        title="設定第 ${index + 1} 團時間">


                                    <div class="flex items-center gap-1">

                                        <input
                                            type="text"
                                            value="${escapeHtml(
                                                group.date || ""
                                            )}"
                                            placeholder="9/8"
                                            maxlength="5"
                                            inputmode="numeric"
                                            onchange="updateGroupDate(${index}, this.value)"
                                            class="w-24 rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 text-center text-sm text-slate-200 focus:border-amber-500 focus:outline-none"
                                            title="設定第 ${index + 1} 團日期">


                                        ${
                                            weekday
                                                ? `
                                                    <span class="whitespace-nowrap text-xs font-semibold text-amber-400">
                                                        (${weekday})
                                                    </span>
                                                `
                                                : ""
                                        }

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");


            /* =====================================================
               隊伍區域
            ====================================================== */

            const area =
                document.getElementById(
                    "teams-area"
                );


            area.innerHTML =

                renderTeam(
                    "team1",
                    "第一隊",
                    "⚔️",
                    "sky"
                ) +

                renderTeam(
                    "team2",
                    "第二隊",
                    "⚔️",
                    "rose"
                ) +

                renderPool();

        }


        /* =========================================================
           啟動
        ========================================================== */

        loadInitialState();

    </script>

</body>

</html>
