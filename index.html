<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 龍王遠征隊伍分配系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

<div class="max-w-7xl mx-auto">

    <header class="mb-6 text-center">
        <h1 class="text-3xl font-bold tracking-wider text-amber-400 mb-2">
            Artale 龍王遠征隊伍分配
        </h1>

        <p id="summary" class="text-slate-400 text-sm">
            目前 5 團・每團 12 人（第一隊 6 人、第二隊 6 人）
        </p>
    </header>


    <!-- 團數控制 -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-6 shadow-lg">

        <div class="flex flex-wrap items-center justify-between gap-3">

            <div>
                <h2 class="text-lg font-bold text-amber-400">
                    🗂️ 遠征團管理
                </h2>

                <p class="text-xs text-slate-400 mt-1">
                    預設 5 團，每團分為第一隊與第二隊，各 6 人。
                </p>
            </div>


            <div class="flex items-center gap-2">

                <button
                    onclick="removeGroup()"
                    class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-semibold transition">
                    ➖ 減少一團
                </button>

                <span
                    id="group-count"
                    class="min-w-16 text-center bg-slate-900 border border-slate-700 px-3 py-2 rounded-lg font-bold">
                    5 / 5
                </span>

                <button
                    onclick="addGroup()"
                    class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-semibold transition">
                    ➕ 新增一團
                </button>

            </div>

        </div>


        <!-- 團隊分頁 -->
        <div id="group-tabs" class="flex flex-wrap gap-2 mt-4"></div>

    </div>



    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- 左側隊伍 -->
        <div class="lg:col-span-2 space-y-6" id="teams-area"></div>


        <!-- 右側控制 -->
        <div class="space-y-6">

            <div
                class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg sticky top-6">

                <h2 class="text-lg font-bold text-emerald-400 mb-3 flex items-center gap-2">
                    <span>📋</span>
                    快速貼上與匯入
                </h2>


                <p class="text-xs text-slate-400 mb-3">

                    請直接貼上格式化名單（支援多行，例如：

                    <br>

                    <code class="text-emerald-300">
                        195 冰雷 小夜 左上
                    </code>

                    <br>

                    <span class="text-amber-400">
                        名單會加入目前選取的團。
                    </span>

                </p>


                <textarea
                    id="paste-input"
                    rows="8"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 mb-3 resize-none font-mono"
                    placeholder="195 冰雷 小夜 左上
169 聖騎 琉雲 左上
166 刀賊 歐巴 左中"></textarea>


                <button
                    onclick="handleBatchImport()"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-md">

                    解析並加入目前團

                </button>


                <hr class="border-slate-700 my-5">


                <button
                    onclick="clearCurrentGroup()"
                    class="w-full bg-rose-900/50 hover:bg-rose-900 text-rose-200 border border-rose-700 font-semibold py-2.5 px-4 rounded-lg text-sm transition">

                    🗑️ 清空目前團

                </button>


                <button
                    onclick="clearAllData()"
                    class="w-full mt-3 bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 font-semibold py-2.5 px-4 rounded-lg text-sm transition">

                    🗑️ 清空全部團

                </button>


                <div
                    class="mt-6 p-3 bg-slate-900/60 rounded-lg border border-slate-700/50 text-xs text-slate-400 space-y-1">

                    <p class="font-semibold text-slate-300">
                        💡 操作提示：
                    </p>

                    <p>
                        1. 先選擇目前的團。
                    </p>

                    <p>
                        2. 貼上包含等級、職業、名字、位置的名單。
                    </p>

                    <p>
                        3. 點擊候選名單中的 1隊／2隊 快速配置位置。
                    </p>

                    <p>
                        4. 資料會自動存於瀏覽器，重新整理不消失。
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>



<script>


/* =========================================================
   基本設定
========================================================= */

const STORAGE_KEY = 'artale_ryuou_groups_state_v4';

const MAX_GROUPS = 5;

const MAX_TEAM_SIZE = 6;



/* =========================================================
   建立空團
========================================================= */

function emptyGroup() {

    return {
        pool: [],
        team1: [],
        team2: []
    };

}



/* =========================================================
   初始化
   ★ 預設直接建立 5 團
========================================================= */

function createDefaultGroups() {

    return [
        emptyGroup(),
        emptyGroup(),
        emptyGroup(),
        emptyGroup(),
        emptyGroup()
    ];

}


let saved = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || 'null'
);



let state;


/*
    如果已經有之前儲存的資料：
    → 保留資料

    如果第一次使用：
    → 直接建立 5 團
*/

if (
    saved &&
    Array.isArray(saved.groups) &&
    saved.groups.length > 0
) {

    state = saved;

} else {

    state = {
        activeGroup: 0,
        groups: createDefaultGroups()
    };

}



/* =========================================================
   確保最多 5 團
========================================================= */

state.groups = state.groups.slice(0, MAX_GROUPS);



/* =========================================================
   如果舊資料只有 1～4 團
   ★ 自動補滿到 5 團
========================================================= */

while (state.groups.length < MAX_GROUPS) {

    state.groups.push(emptyGroup());

}



/* =========================================================
   確保目前選取團沒有超出範圍
========================================================= */

if (
    typeof state.activeGroup !== 'number' ||
    state.activeGroup < 0 ||
    state.activeGroup >= state.groups.length
) {

    state.activeGroup = 0;

}



/* =========================================================
   目前團
========================================================= */

function currentGroup() {

    return state.groups[state.activeGroup];

}



/* =========================================================
   儲存資料
========================================================= */

function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

    render();

}



/* =========================================================
   新增團
========================================================= */

function addGroup() {

    if (state.groups.length >= MAX_GROUPS) {

        alert('目前已經有 5 團。');

        return;

    }


    state.groups.push(emptyGroup());

    state.activeGroup = state.groups.length - 1;

    saveState();

}



/* =========================================================
   減少一團
========================================================= */

function removeGroup() {

    if (state.groups.length <= 1) {

        alert('至少要保留 1 團。');

        return;

    }


    const index = state.activeGroup;

    const group = state.groups[index];


    const total =
        group.pool.length +
        group.team1.length +
        group.team2.length;


    if (
        total > 0 &&
        !confirm(
            `第 ${index + 1} 團目前有 ${total} 人，確定要刪除這一團嗎？`
        )
    ) {

        return;

    }


    state.groups.splice(index, 1);


    if (
        state.activeGroup >= state.groups.length
    ) {

        state.activeGroup =
            state.groups.length - 1;

    }


    saveState();

}



/* =========================================================
   選擇團
========================================================= */

function selectGroup(index) {

    state.activeGroup = index;

    saveState();

}



/* =========================================================
   匯入名單
========================================================= */

function handleBatchImport() {

    const input =
        document.getElementById('paste-input');

    const text =
        input.value.trim();


    if (!text) {

        alert('請先貼上名單。');

        return;

    }


    const group = currentGroup();


    let addedCount = 0;

    let skippedCount = 0;



    text
        .split(/\r?\n/)
        .forEach(line => {

            line = line.trim();


            if (!line) {

                return;

            }


            const parts =
                line.split(/\s+/);


            let name = '';

            let job = '';

            let position = '';



            /* -----------------------------------------
               1 個欄位

               小夜
            ----------------------------------------- */

            if (parts.length === 1) {

                name = parts[0];

                job = '未填';

            }



            /* -----------------------------------------
               2 個欄位

               小夜 冰雷
            ----------------------------------------- */

            else if (parts.length === 2) {

                name = parts[0];

                job = parts[1];

            }



            /* -----------------------------------------
               3 個欄位

               195 冰雷 小夜

               或

               冰雷 小夜 左上
            ----------------------------------------- */

            else if (parts.length === 3) {

                if (!isNaN(parts[0])) {

                    /*
                        等級
                        職業
                        名字
                    */

                    job = parts[1];

                    name = parts[2];

                } else {

                    /*
                        職業
                        名字
                        位置
                    */

                    job = parts[0];

                    name = parts[1];

                    position = parts[2];

                }

            }



            /* -----------------------------------------
               4 個以上欄位

               195 冰雷 小夜 左上

               195 冰雷 小夜 左上 其他
            ----------------------------------------- */

            else {

                if (!isNaN(parts[0])) {

                    /*
                        等級
                        職業
                        名字
                        位置
                    */

                    job = parts[1];

                    name = parts[2];

                    position =
                        parts.slice(3).join(' ');

                } else {

                    /*
                        職業
                        名字
                        位置
                    */

                    job = parts[0];

                    name = parts[1];

                    position =
                        parts.slice(2).join(' ');

                }

            }



            /* -----------------------------------------
               無法取得名字
            ----------------------------------------- */

            if (!name) {

                skippedCount++;

                return;

            }



            /* -----------------------------------------
               顯示職業 + 位置
            ----------------------------------------- */

            let displayJob = job;


            if (position) {

                displayJob =
                    `${job} (${position})`;

            }



            /* -----------------------------------------
               ★ 重點
               
               不再檢查「名字是否重複」
               
               所以同名玩家也可以加入
            ----------------------------------------- */

            group.pool.push({

                id:
                    Date.now() +
                    '-' +
                    Math.random()
                        .toString(36)
                        .substring(2, 10),

                name: name,

                job: displayJob

            });


            addedCount++;

        });



    input.value = '';


    saveState();



    if (skippedCount > 0) {

        alert(
            `成功加入 ${addedCount} 人。\n` +
            `${skippedCount} 筆資料無法解析。`
        );

    } else {

        alert(
            `成功加入 ${addedCount} 人。`
        );

    }

}



/* =========================================================
   移動成員
========================================================= */

function moveTo(
    index,
    fromGroup,
    toGroup
) {

    const group = currentGroup();

    let item;



    if (fromGroup === 'pool') {

        item =
            group.pool.splice(index, 1)[0];

    }


    if (fromGroup === 'team1') {

        item =
            group.team1.splice(index, 1)[0];

    }


    if (fromGroup === 'team2') {

        item =
            group.team2.splice(index, 1)[0];

    }



    if (!item) {

        return;

    }



    if (toGroup === 'pool') {

        group.pool.push(item);

    }


    else if (toGroup === 'team1') {

        if (
            group.team1.length <
            MAX_TEAM_SIZE
        ) {

            group.team1.push(item);

        } else {

            alert('第一隊已滿（6人）');

            group.pool.push(item);

        }

    }


    else if (toGroup === 'team2') {

        if (
            group.team2.length <
            MAX_TEAM_SIZE
        ) {

            group.team2.push(item);

        } else {

            alert('第二隊已滿（6人）');

            group.pool.push(item);

        }

    }



    saveState();

}



/* =========================================================
   清空目前團
========================================================= */

function clearCurrentGroup() {

    if (
        confirm(
            `確定要清空第 ${state.activeGroup + 1} 團嗎？`
        )
    ) {

        state.groups[state.activeGroup] =
            emptyGroup();

        saveState();

    }

}



/* =========================================================
   清空全部
========================================================= */

function clearAllData() {

    if (
        confirm(
            '確定要清空所有 5 團伍與所有候選名單嗎？'
        )
    ) {

        /*
            ★ 清空後仍然保持 5 團
        */

        state = {

            activeGroup: 0,

            groups: createDefaultGroups()

        };


        saveState();

    }

}



/* =========================================================
   成員卡片
========================================================= */

function memberCard(
    p,
    index,
    teamName
) {

    const color =
        teamName === 'team1'
            ? 'sky'
            : 'rose';


    const arrow =
        teamName === 'team1'
            ? '➡️'
            : '⬅️';


    const target =
        teamName === 'team1'
            ? 'team2'
            : 'team1';


    const title =
        teamName === 'team1'
            ? '移至第二隊'
            : '移至第一隊';



    return `

        <div
            class="bg-slate-900/80 border border-${color}-500/30 rounded-lg p-3 flex justify-between items-center shadow">

            <div class="min-w-0 pr-2">

                <span
                    class="text-xs text-${color}-400 font-bold mr-1.5">

                    #${index + 1}

                </span>


                <span
                    class="font-bold text-slate-100">

                    ${escapeHtml(p.name)}

                </span>


                <span
                    class="text-xs text-slate-300 ml-1.5 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">

                    ${escapeHtml(p.job)}

                </span>

            </div>


            <div class="flex gap-1 shrink-0">

                <button
                    onclick="moveTo(${index}, '${teamName}', '${target}')"
                    title="${title}"
                    class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300">

                    ${arrow}

                </button>


                <button
                    onclick="moveTo(${index}, '${teamName}', 'pool')"
                    title="退回候選區"
                    class="text-xs bg-rose-900/60 hover:bg-rose-800 px-2 py-1 rounded text-rose-200">

                    ❌

                </button>

            </div>

        </div>

    `;

}



/* =========================================================
   顯示隊伍
========================================================= */

function renderTeam(
    teamName,
    title,
    emoji,
    color
) {

    const group = currentGroup();

    const members =
        group[teamName];


    let html = `

        <div
            class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">

            <div
                class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">

                <h2
                    class="text-xl font-bold text-${color}-400 flex items-center gap-2">

                    <span>${emoji}</span>

                    ${title}

                    <span
                        class="text-sm font-normal text-slate-400">

                        (上限 6 人)

                    </span>

                </h2>


                <span
                    class="bg-${color}-900 text-${color}-200 text-xs px-2.5 py-1 rounded-full font-semibold">

                    ${members.length} / 6

                </span>

            </div>


            <div
                class="grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[120px]">

    `;



    for (
        let i = 0;
        i < MAX_TEAM_SIZE;
        i++
    ) {

        if (i < members.length) {

            html +=
                memberCard(
                    members[i],
                    i,
                    teamName
                );

        } else {

            html += `

                <div
                    class="border border-dashed border-slate-700 rounded-lg p-3 flex items-center justify-center text-slate-600 text-xs">

                    (空位)

                </div>

            `;

        }

    }



    html += `

            </div>

        </div>

    `;


    return html;

}



/* =========================================================
   顯示候選名單
========================================================= */

function renderPool() {

    const group = currentGroup();


    let html = `

        <div
            class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">

            <div
                class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">

                <h2
                    class="text-xl font-bold text-amber-400 flex items-center gap-2">

                    <span>👥</span>

                    第 ${state.activeGroup + 1} 團・待分配名單

                </h2>


                <span
                    class="bg-amber-900 text-amber-200 text-xs px-2.5 py-1 rounded-full font-semibold">

                    ${group.pool.length} 人

                </span>

            </div>


            <div
                class="flex flex-wrap gap-2 min-h-[80px]">

    `;



    if (group.pool.length === 0) {

        html += `

            <p
                class="text-slate-500 text-sm italic py-2">

                目前沒有待分配成員，請從右側貼上名單。

            </p>

        `;

    }

    else {

        group.pool.forEach(
            (p, index) => {

                html += `

                    <div
                        class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 flex items-center gap-2 text-sm shadow">

                        <div>

                            <span
                                class="font-semibold text-slate-200">

                                ${escapeHtml(p.name)}

                            </span>


                            <span
                                class="text-xs text-slate-300 ml-1 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">

                                ${escapeHtml(p.job)}

                            </span>

                        </div>


                        <div
                            class="flex gap-1 ml-2">

                            <button
                                onclick="moveTo(${index}, 'pool', 'team1')"
                                class="text-xs bg-sky-900 hover:bg-sky-800 text-sky-200 px-1.5 py-0.5 rounded">

                                1隊

                            </button>


                            <button
                                onclick="moveTo(${index}, 'pool', 'team2')"
                                class="text-xs bg-rose-900 hover:bg-rose-800 text-rose-200 px-1.5 py-0.5 rounded">

                                2隊

                            </button>

                        </div>

                    </div>

                `;

            }
        );

    }



    html += `

            </div>

        </div>

    `;


    return html;

}



/* =========================================================
   HTML 安全處理
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            '&',
            '&amp;'
        )

        .replaceAll(
            '<',
            '&lt;'
        )

        .replaceAll(
            '>',
            '&gt;'
        )

        .replaceAll(
            '"',
            '&quot;'
        )

        .replaceAll(
            "'",
            '&#039;'
        );

}



/* =========================================================
   整體畫面
========================================================= */

function render() {

    const count =
        state.groups.length;



    document
        .getElementById('group-count')
        .innerText =
        `${count} / 5`;



    document
        .getElementById('summary')
        .innerText =
        `目前 ${count} 團・每團 12 人（第一隊 6 人、第二隊 6 人）`;



    /* -----------------------------------------
       團隊按鈕
    ----------------------------------------- */

    const tabs =
        document.getElementById(
            'group-tabs'
        );


    tabs.innerHTML =
        state.groups
            .map(
                (_, i) => `

                    <button
                        onclick="selectGroup(${i})"
                        class="px-4 py-2 rounded-lg font-semibold text-sm transition

                        ${
                            i === state.activeGroup

                                ? 'bg-amber-500 text-slate-950 shadow-md'

                                : 'bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700'
                        }">

                        第 ${i + 1} 團

                    </button>

                `
            )
            .join('');



    /* -----------------------------------------
       隊伍
    ----------------------------------------- */

    const area =
        document.getElementById(
            'teams-area'
        );


    area.innerHTML =

        renderTeam(
            'team1',
            '第一隊',
            '⚔️',
            'sky'
        )

        +

        renderTeam(
            'team2',
            '第二隊',
            '⚔️',
            'rose'
        )

        +

        renderPool();

}



/* =========================================================
   啟動
========================================================= */

render();


</script>

</body>
</html>
